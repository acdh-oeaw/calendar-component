<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calendar</title>
		<style>
			:root {
				font-family: ui-sans-serif, system-ui, sans-serif;
			}

			acdh-calendar-year td > button[data-event-kinds] {
				--calendar-cell-color: dodgerblue;
			}

			acdh-calendar-year td > button[data-event-kinds="birthday"] {
				--calendar-cell-color: hotpink;
			}

			acdh-calendar-year td > button[data-event-kinds="party"] {
				--calendar-cell-color: lime;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<acdh-calendar year="2024">
				<fieldset>
					<legend>Select a year</legend>
					<acdh-calendar-year-radio-group sparse></acdh-calendar-year-radio-group>
				</fieldset>
				<acdh-calendar-year weekdays></acdh-calendar-year>
			</acdh-calendar>
		</div>

		<script type="module">
			import de from "/src/i18n/de.ts";
			import { register } from "/src/index.ts";

			register();

			const calendar = document.querySelector("acdh-calendar");

			calendar.i18n = de;

			const events = [
				{ date: new Date(Date.UTC(2021, 8, 26)), label: "Mein Geburtstag", kind: "birthday" },
				// { date: new Date(Date.UTC(2022, 8, 26)), label: "Mein Geburtstag", kind: "birthday" },
				{ date: new Date(Date.UTC(2023, 8, 26)), label: "Mein Geburtstag", kind: "birthday" },
				{ date: new Date(Date.UTC(2024, 8, 26)), label: "Mein Geburtstag", kind: "birthday" },
				{ date: new Date(Date.UTC(2024, 8, 26)), label: "Geburtstagsparty", kind: "party" },
			];

			calendar.events = events;

			calendar.addEventListener("calendar-event-click", (event) => {
				const { date, events } = event.detail;

				alert(
					`${date.toLocaleDateString("de", { timeZone: "UTC" })} mit ${events.length} Ereignissen:\n${events
						.map((event) => {
							return `- ${event.label}`;
						})
						.join("\n")}.`,
				);
			});
		</script>
	</body>
</html>
