name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits, tags, and create github releases
      id-token: write # npm trusted publishing
      pull-requests: write # create release pull request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Necessary because `actions/setup-node` does not yet support `corepack`.
      # @see https://github.com/actions/setup-node/issues/531
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          # avoid cache poisoning, because this job can publish to npm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish to NPM
        uses: changesets/action@v2
        with:
          commit-message: "build: version package"
          pr-title: "build: release new package version"
          version-script: pnpm run ci:version
          publish-script: pnpm run ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
