name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits, tags, and create github releases
      id-token: write # npm trusted publishing
      pull-requests: write # create release pull request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          # avoid cache poisoning, because this job can publish to npm
          cache: false
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish to NPM
        uses: changesets/action@v2
        with:
          commit-message: "build: version package"
          pr-title: "build: release new package version"
          version-script: pnpm run ci:version
          publish-script: pnpm run ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
